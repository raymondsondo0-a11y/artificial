name: Deploy Raymond AI Engine

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install --global wrangler

      - name: Deploy Cloudflare Worker
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Configure private chat key
        run: |
          if [ -z "$RAYMOND_AI_ACCESS_KEY" ]; then
            echo "Missing RAYMOND_AI_ACCESS_KEY repository secret."
            exit 1
          fi
          printf '%s' "$RAYMOND_AI_ACCESS_KEY" | wrangler secret put RAYMOND_AI_ACCESS_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RAYMOND_AI_ACCESS_KEY: ${{ secrets.RAYMOND_AI_ACCESS_KEY }}
