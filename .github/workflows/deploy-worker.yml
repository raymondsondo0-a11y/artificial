name: Deploy Raymond AI Engine

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install --global wrangler

      - name: Diagnose Cloudflare token before deployment
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is missing."
            exit 1
          fi

          echo "Checking whether the Cloudflare API token is valid..."
          VERIFY="$(curl --silent --show-error --fail \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)"
          echo "$VERIFY" | jq -e '.success == true' >/dev/null
          echo "TOKEN_VALIDITY: $(echo "$VERIFY" | jq -r '.result.status // "unknown"')"

          echo "Checking which Cloudflare account Wrangler can access..."
          wrangler whoami

      - name: Deploy Cloudflare Worker
        run: wrangler deploy --log-level debug
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Configure private chat key
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RAYMOND_AI_ACCESS_KEY:-}" ]; then
            echo "::error::Missing RAYMOND_AI_ACCESS_KEY repository secret."
            exit 1
          fi
          printf '%s' "$RAYMOND_AI_ACCESS_KEY" | wrangler secret put RAYMOND_AI_ACCESS_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RAYMOND_AI_ACCESS_KEY: ${{ secrets.RAYMOND_AI_ACCESS_KEY }}
